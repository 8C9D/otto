name: CI

on:
  push:
  pull_request:

jobs:
  domain-tests:
    name: OttoDomain tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)/Contents/Developer"
      - name: Run domain tests
        run: swift test --package-path Packages/OttoDomain

  persistence-tests:
    name: OttoPersistence tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)/Contents/Developer"
      - name: Run persistence tests
        run: swift test --package-path Packages/OttoPersistence

  app-build:
    name: App build and lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)/Contents/Developer"
      - name: Install tools
        run: brew install xcodegen swiftlint
      - name: Lint
        run: swiftlint --strict
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: >
          xcodebuild build
          -project Otto.xcodeproj
          -scheme Otto
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
