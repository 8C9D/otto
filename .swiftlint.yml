included:
  - Otto
  - Packages

# Globbed, not hand-listed: a fourth package's .build must be impossible to
# forget (the same reasoning as verify.sh's derived package list).
excluded:
  - Packages/*/.build

opt_in_rules:
  - force_unwrapping

# Force-unwrap and force-try are errors, not warnings: every mapping or
# conversion failure in this codebase is handled explicitly (spec §3.4).
force_unwrapping:
  severity: error
force_try:
  severity: error
force_cast:
  severity: error

line_length:
  warning: 140
  error: 200

# Spec §3.5 (v2.4): only the Exported* types may cross a wire. The domain
# models' own Codable conformance encodes Date with whatever strategy the
# ambient coder carries, so a default JSONEncoder on any wire reinstates the
# 2001 epoch. A wire needs a coder, and the only production code allowed to
# construct one is the Export layer, whose types pin every strategy
# explicitly. Tests are exempt - domain Codable is for tests and in-process
# use, which is precisely the boundary being enforced.
# Spec §5.2a (v1.7): the stored status is unreadable above layer 2. Every
# consumer read goes through effectiveStatus(asOf:) or an intent-named
# transition/edit API on Subscription; only the domain model itself and the
# persistence mapping may touch storedStatus. Tests are exempt (asserting what
# a flow persisted is exactly a stored read).
# Spec §4a principle 2b (v2.1): readingRepaired is the §4a READ construction,
# permissive by design - a write path must never borrow its tolerance, or a
# future change to the repair rules silently changes write validation. The UI
# layer (all write flows), the repository protocols, and the app target may
# not name it; reads route through the domain's Codable and the persistence
# mapping, and the edit path describes with Subscription.describing.
custom_rules:
  wire_coder_outside_export:
    name: "Wire coder outside the Exported* layer"
    regex: '\b(?:JSONEncoder|JSONDecoder|PropertyListEncoder|PropertyListDecoder|JSONSerialization)\b'
    included:
      - ".*/Packages/[^/]+/Sources/.*"
      - ".*/Otto/.*\\.swift"
    excluded:
      - ".*/Packages/OttoDomain/Sources/OttoDomain/Export/.*"
    message: >-
      Only the Exported* types may cross a wire (spec §3.5, v2.4). Domain
      Codable carries the ambient Date strategy - a default coder brings the
      2001 epoch back. Go through the Export layer (exportData/decodeExport),
      or add an Exported* type rather than reusing a domain one.
    severity: error
  reading_repaired_in_write_path:
    name: "Read-path tolerance in a write path"
    regex: '\breadingRepaired\b'
    included:
      - ".*/Packages/OttoUI/Sources/.*"
      - ".*/Packages/OttoPersistence/Sources/OttoRepositories/.*"
      - ".*/Otto/.*\\.swift"
    message: >-
      readingRepaired is the §4a READ construction, permissive by design
      (spec §4a principle 2b, v2.1). Describe an editable degraded shape with
      Subscription.describing, or construct through the preconditioned init.
    severity: error
  stored_status_above_layer_2:
    name: "Stored status read above layer 2"
    regex: '\bstoredStatus\b'
    included:
      - ".*/Packages/OttoUI/Sources/.*"
      - ".*/Packages/OttoPersistence/Sources/OttoRepositories/.*"
      - ".*/Otto/.*\\.swift"
    message: >-
      Stored status is unreadable above layer 2 (spec §5.2a, v1.7). Derive with
      effectiveStatus(asOf:) or use a Subscription transition/edit API.
    severity: error
