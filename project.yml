# XcodeGen project definition. The .xcodeproj is generated from this file and is
# never hand-edited or committed - run `xcodegen generate` after changing it.
name: Otto

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

# Signing identity lives outside the repo: Config/Base.xcconfig optionally
# includes the gitignored Config/Signing.local.xcconfig (see the .example).
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  OttoDomain:
    path: Packages/OttoDomain
  OttoPersistence:
    path: Packages/OttoPersistence
  OttoUI:
    path: Packages/OttoUI

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic

targets:
  Otto:
    type: application
    platform: iOS
    sources:
      - path: Otto
        excludes:
          - "**/.gitkeep"
    # The app is the composition root: the ONLY target that links the concrete
    # OttoPersistence. The UI lives in the OttoUI package, which cannot import
    # it - the layering is a compiler rule, not a convention.
    dependencies:
      - package: OttoDomain
      - package: OttoPersistence
        product: OttoRepositories
      - package: OttoPersistence
        product: OttoPersistence
      - package: OttoUI
        product: OttoServices
      - package: OttoUI
        product: OttoStores
      - package: OttoUI
        product: OttoUI
    settings:
      base:
        # PERMANENT - never change this identifier (spec §10, decision 1).
        PRODUCT_BUNDLE_IDENTIFIER: com.arthurzhang.otto
        PRODUCT_NAME: Otto
        # Otto/Resources/Assets.xcassets is picked up by the `Otto` source path
        # above; this is the setting that makes the catalog's AppIcon set the
        # actual app icon, and XcodeGen does not infer it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The two version numbers, in one place. Info.plist is generated, so
        # these are the lines to bump - CURRENT_PROJECT_VERSION must be unique
        # per TestFlight upload or App Store Connect rejects the build.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      # The CloudKit container this configuration syncs to. Debug reaches the
      # development environment, whose schema builds itself. Release is empty
      # because TestFlight and the App Store reach PRODUCTION, which rejects
      # everything until the schema is deployed there: set it only after
      # docs/sync-verification.md's deploy step. Empty means no sync, and the
      # Settings screen says so.
      configs:
        Debug:
          OTTO_CLOUDKIT_CONTAINER: iCloud.com.arthurzhang.otto
        Release:
          OTTO_CLOUDKIT_CONTAINER: ""
    # Info.plist and entitlements are generated by XcodeGen from the properties
    # below, so both generated files are gitignored.
    info:
      path: Otto/App/Info.plist
      properties:
        CFBundleDisplayName: Otto
        UILaunchScreen: {}
        # App Store Connect rejects a bundle with no orientation keys, and iPad
        # multitasking needs all four. These are Xcode's template defaults and
        # match what iOS assumed while the keys were absent.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Without these two, XcodeGen hardcodes 1.0/1 into the generated plist
        # and the build settings above would have no effect.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Otto ships no cryptography of its own: the only encryption it touches
        # is Apple's own HTTPS and CloudKit transport, which is exempt. Stating
        # it here answers App Store Connect's export compliance question once
        # instead of on every upload.
        ITSAppUsesNonExemptEncryption: false
        # Background fetch drives the daily reschedule; remote notifications
        # carry CloudKit sync pushes (spec §6.2, Wave 6).
        UIBackgroundModes:
          - fetch
          - remote-notification
        # Read by the composition root; see OTTO_CLOUDKIT_CONTAINER above.
        OttoCloudKitContainer: "$(OTTO_CLOUDKIT_CONTAINER)"
        # BGTaskScheduler refuses to register identifiers not declared here.
        # Must match NotificationCoordinator.refreshTaskIdentifier.
        BGTaskSchedulerPermittedIdentifiers:
          - com.arthurzhang.otto.refresh
        # The pre-sync backup snapshot (spec §8) lands in Documents; these two
        # keys are what make it findable in the Files app - "stored where the
        # user can find it" is a plist setting, not just a directory choice.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    # Time-sensitive notifications let trial deadline reminders break through
    # Focus modes (spec §6.3).
    entitlements:
      path: Otto/App/Otto.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.arthurzhang.otto
        com.apple.developer.usernotifications.time-sensitive: true

  # The real app on a real mirrored store. Named apart from OttoUI's OttoUITests,
  # and run by scripts/sync-lifecycle.sh, which supplies the fresh simulator, the
  # ad-hoc signing and the seeded backup this test cannot give itself.
  OttoLifecycleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Otto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.arthurzhang.otto.lifecycle-uitests

schemes:
  Otto:
    build:
      targets:
        Otto: all
    test:
      targets:
        - OttoLifecycleUITests
